<!-- =====================================================
     LUNASHID SMART FEATURES
===================================================== -->

<div
    id="smartSearch"
    class="smart-search"
>

    <div
        class="smart-search-backdrop"
        onclick="closeSmartSearch()"
    ></div>

    <div class="smart-search-box">

        <div class="smart-search-head">

            <div>

                <span>SEARCH LUNASHID</span>

                <h2>
                    جستجوی محصولات
                </h2>

            </div>

            <button
                type="button"
                onclick="closeSmartSearch()"
            >
                ×
            </button>

        </div>

        <input
            id="smartSearchInput"
            type="search"
            placeholder="نام محصول یا دسته‌بندی..."
            autocomplete="off"
            oninput="searchLunashid(this.value)"
        >

        <div
            id="smartSearchResults"
            class="smart-search-results"
        >
            عبارت موردنظر را جستجو کنید.
        </div>

    </div>

</div>


<!-- QUICK VIEW -->

<div
    id="quickView"
    class="quick-view"
    onclick="closeQuickView(event)"
>

    <div class="quick-view-card">

        <button
            class="quick-view-close"
            onclick="closeQuickView()"
        >
            ×
        </button>

        <img
            id="quickViewImage"
            src=""
            alt=""
        >

        <div class="quick-view-content">

            <span id="quickViewCategory"></span>

            <h2 id="quickViewName"></h2>

            <p id="quickViewDescription"></p>

            <strong id="quickViewPrice"></strong>

            <div
                id="quickViewStock"
                class="quick-view-stock"
            ></div>

            <div class="quick-view-actions">

                <button
                    id="quickViewCart"
                    type="button"
                >
                    افزودن به سبد
                </button>

                <button
                    id="quickViewWishlist"
                    type="button"
                    class="quick-wishlist-button"
                >
                    ♡ علاقه‌مندی
                </button>

            </div>

        </div>

    </div>

</div>


<!-- RECENT PRODUCTS -->

<div
    id="recentProducts"
    class="recent-products"
>

    <div class="recent-products-head">

        <div>

            <span>
                RECENTLY VIEWED
            </span>

            <h3>
                اخیراً دیده‌شده
            </h3>

        </div>

        <button
            onclick="clearRecentProducts()"
        >
            پاک کردن
        </button>

    </div>

    <div
        id="recentProductsList"
        class="recent-products-list"
    ></div>

</div>


<!-- FLOATING SMART BUTTONS -->

<div class="smart-floating">

    <button
        type="button"
        onclick="openSmartSearch()"
        title="جستجو"
    >
        ⌕
    </button>

    <button
        type="button"
        onclick="openRecentProducts()"
        title="اخیراً دیده‌شده"
    >
        ◷
    </button>

</div>

<script>

/* =====================================================
   HELPERS
===================================================== */

function smartMoney(value){

    return Number(value || 0)
        .toLocaleString("fa-IR") +
        " تومان";

}


function smartImage(image){

    if(image){

        return "/static/uploads/products/" +
            image;

    }

    return "/static/uploads/products/no-image.svg";

}


/* =====================================================
   SEARCH
===================================================== */

function openSmartSearch(){

    const box =
        document.getElementById(
            "smartSearch"
        );

    box.classList.add("open");

    setTimeout(() => {

        document
            .getElementById(
                "smartSearchInput"
            )
            .focus();

    },100);

}


function closeSmartSearch(){

    document
        .getElementById(
            "smartSearch"
        )
        .classList.remove("open");

}


let searchTimer = null;


async function searchLunashid(query){

    clearTimeout(searchTimer);

    const results =
        document.getElementById(
            "smartSearchResults"
        );

    if(!query.trim()){

        results.innerHTML =
            "عبارت موردنظر را جستجو کنید.";

        return;

    }

    results.innerHTML =
        "در حال جستجو...";

    searchTimer =
        setTimeout(
            async () => {

                try{

                    const response =
                        await fetch(
                            "/api/search-products?q=" +
                            encodeURIComponent(query)
                        );

                    const data =
                        await response.json();

                    if(!data.items.length){

                        results.innerHTML =
                            "محصولی پیدا نشد.";

                        return;

                    }

                    results.innerHTML =
                        data.items.map(
                            product => `

                            <div class="search-result">

                                <img
                                    src="${smartImage(product.image)}"
                                    onerror="this.src='/static/uploads/products/no-image.svg'"
                                >

                                <div>

                                    <h4>
                                        ${product.name}
                                    </h4>

                                    <div>
                                        ${product.category || ""}
                                    </div>

                                    <div class="search-result-price">
                                        ${smartMoney(product.price)}
                                    </div>

                                </div>

                                <div>

                                    <button
                                        onclick="openQuickView(${product.id})"
                                    >
                                        مشاهده
                                    </button>

                                </div>

                            </div>

                        `
                        ).join("");

                }catch(error){

                    results.innerHTML =
                        "خطا در جستجو.";

                    console.error(error);

                }

            },
            250
        );

}


/* =====================================================
   QUICK VIEW
===================================================== */

async function openQuickView(productId){

    try{

        const response =
            await fetch(
                "/api/product-info/" +
                productId
            );

        const data =
            await response.json();

        if(!data.ok){

            return;

        }

        const p = data.product;

        document
            .getElementById(
                "quickViewImage"
            )
            .src =
                smartImage(p.image);

        document
            .getElementById(
                "quickViewName"
            )
            .textContent =
                p.name;

        document
            .getElementById(
                "quickViewCategory"
            )
            .textContent =
                p.category || "LUNASHID";

        document
            .getElementById(
                "quickViewDescription"
            )
            .textContent =
                p.description ||
                "محصول دست‌ساز لوناشید.";

        document
            .getElementById(
                "quickViewPrice"
            )
            .textContent =
                smartMoney(p.price);

        const stock =
            document.getElementById(
                "quickViewStock"
            );

        if(p.stock !== null && p.stock <= 0){

            stock.textContent =
                "ناموجود";

            stock.style.color =
                "#A91D3A";

        }else{

            stock.textContent =
                p.stock === null
                ? "موجود"
                : "موجودی: " + p.stock;

            stock.style.color =
                "#5b8067";

        }

        document
            .getElementById(
                "quickViewCart"
            )
            .onclick = () => {

                addToMiniCart(
                    p.id
                );

            };

        document
            .getElementById(
                "quickViewWishlist"
            )
            .onclick = () => {

                toggleWishlist(
                    p.id
                );

            };

        document
            .getElementById(
                "quickView"
            )
            .classList.add("open");

    }catch(error){

        console.error(error);

    }

}


function closeQuickView(event){

    if(
        event &&
        event.target &&
        event.target.id === "quickViewImage"
    ){

        return;

    }

    document
        .getElementById(
            "quickView"
        )
        .classList.remove("open");

}


/* =====================================================
   WISHLIST
===================================================== */

async function toggleWishlist(productId){

    try{

        const response =
            await fetch(
                "/api/wishlist/toggle/" +
                productId,
                {
                    method:"POST"
                }
            );

        const data =
            await response.json();

        if(data.ok){

            const button =
                document.getElementById(
                    "quickViewWishlist"
                );

            button.textContent =
                data.active
                ? "♥ ذخیره شد"
                : "♡ علاقه‌مندی";

        }

    }catch(error){

        console.error(error);

    }

}


/* =====================================================
   RECENTLY VIEWED
===================================================== */

function getRecentProducts(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "lunashid_recent"
            ) || "[]"
        );

    }catch{

        return [];

    }

}


function saveRecentProduct(productId){

    let items =
        getRecentProducts();

    items =
        items.filter(
            id => Number(id) !== Number(productId)
        );

    items.unshift(
        Number(productId)
    );

    items =
        items.slice(0,8);

    localStorage.setItem(
        "lunashid_recent",
        JSON.stringify(items)
    );

}


async function loadRecentProducts(){

    const list =
        document.getElementById(
            "recentProductsList"
        );

    if(!list){

        return;

    }

    const ids =
        getRecentProducts();

    if(!ids.length){

        list.innerHTML =
            "هنوز محصولی مشاهده نشده است.";

        return;

    }

    list.innerHTML =
        "در حال بارگذاری...";

    const products = [];

    for(const id of ids){

        try{

            const response =
                await fetch(
                    "/api/product-info/" +
                    id
                );

            const data =
                await response.json();

            if(data.ok){

                products.push(
                    data.product
                );

            }

        }catch{}

    }

    list.innerHTML =
        products.map(
            p => `

            <div
                class="recent-product"
                onclick="openQuickView(${p.id})"
            >

                <img
                    src="${smartImage(p.image)}"
                    onerror="this.src='/static/uploads/products/no-image.svg'"
                >

                <div>

                    <strong>
                        ${p.name}
                    </strong>

                    <span>
                        ${smartMoney(p.price)}
                    </span>

                </div>

            </div>

        `
        ).join("");

}


function openRecentProducts(){

    const panel =
        document.getElementById(
            "recentProducts"
        );

    panel.classList.toggle("open");

    loadRecentProducts();

}


function clearRecentProducts(){

    localStorage.removeItem(
        "lunashid_recent"
    );

    loadRecentProducts();

}


/* =====================================================
   تشخیص صفحه محصول
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const match =
            window.location.pathname.match(
                /^\/product\/(\d+)/
            );

        if(match){

            saveRecentProduct(
                Number(match[1])
            );

        }

        loadRecentProducts();

    }
);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeSmartSearch();
            closeQuickView();

            document
                .getElementById(
                    "recentProducts"
                )
                ?.classList.remove("open");

        }

    }
);

</script>
