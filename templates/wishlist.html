{% extends "base.html" %}

{% block title %}
علاقه‌مندی‌ها | لوناشید
{% endblock %}

{% block content %}

<section
    style="
        max-width:1100px;
        margin:50px auto;
        padding:20px;
        direction:rtl;
    "
>

    <div style="margin-bottom:30px;">

        <span
            style="
                color:#A91D3A;
                font-size:10px;
                letter-spacing:3px;
            "
        >
            MY WISHLIST
        </span>

        <h1>
            علاقه‌مندی‌های من
        </h1>

    </div>


    <div
        id="wishlistPage"
        style="
            display:grid;
            grid-template-columns:
                repeat(auto-fill,minmax(220px,1fr));
            gap:20px;
        "
    >
        در حال بارگذاری...
    </div>

</section>


<script>

async function loadWishlistPage(){

    const container =
        document.getElementById(
            "wishlistPage"
        );

    const response =
        await fetch(
            "/api/wishlist"
        );

    const data =
        await response.json();

    if(!data.items.length){

        container.innerHTML = `
            <div
                style="
                    grid-column:1/-1;
                    padding:60px;
                    text-align:center;
                    border-radius:25px;
                    background:rgba(255,255,255,.18);
                "
            >
                هنوز محصولی به علاقه‌مندی‌ها اضافه نکرده‌اید.
            </div>
        `;

        return;

    }

    const products = [];

    for(const id of data.items){

        try{

            const response =
                await fetch(
                    "/api/product-info/" +
                    id
                );

            const result =
                await response.json();

            if(result.ok){

                products.push(
                    result.product
                );

            }

        }catch{}

    }

    container.innerHTML =
        products.map(
            p => `

            <article
                style="
                    overflow:hidden;
                    border-radius:25px;
                    background:rgba(255,255,255,.18);
                    border:1px solid rgba(255,255,255,.35);
                "
            >

                <img
                    src="${
                        p.image
                        ? '/static/uploads/products/' + p.image
                        : '/static/uploads/products/no-image.svg'
                    }"
                    style="
                        width:100%;
                        height:230px;
                        object-fit:cover;
                    "
                >

                <div
                    style="
                        padding:18px;
                        direction:rtl;
                    "
                >

                    <h3>
                        ${p.name}
                    </h3>

                    <strong
                        style="
                            color:#A91D3A;
                        "
                    >
                        ${Number(p.price || 0).toLocaleString("fa-IR")}
                        تومان
                    </strong>

                    <div
                        style="
                            display:flex;
                            gap:8px;
                            margin-top:15px;
                        "
                    >

                        <a
                            href="/product/${p.id}"
                            style="
                                flex:1;
                                text-align:center;
                                padding:11px;
                                border-radius:12px;
                                background:#A91D3A;
                                color:white;
                                text-decoration:none;
                            "
                        >
                            مشاهده
                        </a>

                        <button
                            onclick="toggleWishlist(${p.id}).then(loadWishlistPage)"
                            style="
                                padding:11px 15px;
                                border:0;
                                border-radius:12px;
                                cursor:pointer;
                            "
                        >
                            حذف
                        </button>

                    </div>

                </div>

            </article>

        `
        ).join("");

}

loadWishlistPage();

</script>

{% endblock %}
