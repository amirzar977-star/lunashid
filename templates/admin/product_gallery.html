{% extends "admin/base.html" %}

{% block title %}گالری {{ product.name }}{% endblock %}

{% block content %}

<style>

.gallery-admin{
    max-width:1000px;
    margin:auto;
    direction:rtl;
}

.gallery-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:25px;
}

.gallery-header h1{
    margin:0;
}

.gallery-header p{
    color:#888;
}

.upload-box{
    padding:30px;
    border-radius:28px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.3);
    backdrop-filter:blur(15px);
    margin-bottom:25px;
}

.upload-box input[type=file]{
    width:100%;
    padding:15px;
    border:1px dashed rgba(0,0,0,.15);
    border-radius:15px;
    box-sizing:border-box;
}

.upload-button{
    margin-top:15px;
    border:0;
    padding:13px 25px;
    border-radius:14px;
    background:#A91D3A;
    color:white;
    font-family:inherit;
    cursor:pointer;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
}

.gallery-card{
    overflow:hidden;
    border-radius:22px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.3);
}

.gallery-card img{
    display:block;
    width:100%;
    height:220px;
    object-fit:cover;
}

.gallery-card-bottom{
    padding:15px;
}

.delete-button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:10px;
    background:rgba(169,29,58,.1);
    color:#A91D3A;
    cursor:pointer;
    font-family:inherit;
}

.empty{
    padding:50px;
    text-align:center;
    color:#999;
}

</style>

<div class="gallery-admin">

    <div class="gallery-header">

        <div>

            <h1>
                گالری محصول
            </h1>

            <p>
                {{ product.name }}
            </p>

        </div>

    </div>


    <div class="upload-box">

        <h3>
            افزودن تصاویر جدید
        </h3>

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            <input
                type="file"
                name="images"
                accept="image/*"
                multiple
                required
            >

            <button
                class="upload-button"
                type="submit"
            >
                افزودن به گالری
            </button>

        </form>

    </div>


    <div class="gallery-grid">

        {% for image in images %}

        <div class="gallery-card">

            <img
                src="{{ url_for(
                    'static',
                    filename='uploads/products/gallery/' ~ image.filename
                ) }}"
                alt="{{ product.name }}"
            >

            <div class="gallery-card-bottom">

                <form
                    method="POST"
                    action="{{ url_for(
                        'admin_delete_product_image',
                        image_id=image.id
                    ) }}"
                    onsubmit="return confirm('این تصویر حذف شود؟');"
                >

                    <button
                        class="delete-button"
                        type="submit"
                    >
                        حذف تصویر
                    </button>

                </form>

            </div>

        </div>

        {% else %}

        <div class="empty">
            هنوز تصویری برای این محصول اضافه نشده است.
        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
