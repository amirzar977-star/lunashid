<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}{{ site_settings.site_name }}{% endblock %}</title>

<style>

:root{
    --site-primary: {{ site_settings.primary_color }};
    --site-accent: {{ site_settings.accent_color }};
    --glass-opacity: {{ site_settings.glass_opacity }};
    --glass-blur: {{ site_settings.glass_blur }}px;
    --glass-border: {{ site_settings.glass_border }};
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:
        Vazirmatn,
        Tahoma,
        Arial,
        sans-serif;

    color:#fff;

    background:
        {% if site_settings.background %}
        linear-gradient(
            rgba(4,25,20,.48),
            rgba(4,25,20,.58)
        ),
        url("{{ site_settings.background }}")
        center / cover fixed;
        {% else %}
        radial-gradient(
            circle at 15% 10%,
            rgba(120,210,160,.14),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 90%,
            rgba(80,160,130,.12),
            transparent 30%
        ),
        #071b16;
        {% endif %}
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

.site-glass{
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,var(--glass-opacity)),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,var(--glass-border));

    backdrop-filter:
        blur(var(--glass-blur))
        saturate(160%);

    -webkit-backdrop-filter:
        blur(var(--glass-blur))
        saturate(160%);

    box-shadow:
        0 20px 70px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.10);
}

.lunashid-header{
    position:relative;

    width:min(
        1200px,
        calc(100% - 32px)
    );

    min-height:82px;

    margin:18px auto;

    padding:12px 18px;

    border-radius:25px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;

    background:
        linear-gradient(
            135deg,
            rgba(16,63,50,.80),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(255,255,255,.14);

    backdrop-filter:
        blur(var(--glass-blur))
        saturate(190%);

    -webkit-backdrop-filter:
        blur(var(--glass-blur))
        saturate(190%);

    box-shadow:
        0 18px 60px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.12);

    overflow:hidden;
}

.lunashid-header::before{
    content:"";

    position:absolute;

    width:230px;
    height:230px;

    top:-170px;
    right:-40px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(190,255,215,.20),
            transparent 70%
        );

    pointer-events:none;
}

.lunashid-brand{
    position:relative;

    display:flex;
    align-items:center;
    gap:12px;

    z-index:1;
}

.lunashid-logo{
    width:48px;
    height:48px;

    border-radius:15px;

    display:grid;
    place-items:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(255,255,255,.18);

    color:var(--site-accent);

    font-size:23px;
    font-weight:900;

    box-shadow:
        0 8px 30px rgba(0,0,0,.18);
}

.lunashid-brand strong{
    display:block;

    letter-spacing:2px;

    font-size:16px;
}

.lunashid-brand span{
    display:block;

    margin-top:3px;

    color:rgba(255,255,255,.42);

    font-size:9px;

    letter-spacing:1.5px;
}

.lunashid-nav{
    display:flex;
    align-items:center;
    gap:5px;

    position:relative;
    z-index:2;
}

.lunashid-nav a{
    padding:11px 14px;

    border-radius:12px;

    color:rgba(255,255,255,.62);

    transition:.2s ease;

    font-size:13px;
}

.lunashid-nav a:hover{
    color:#fff;

    background:
        rgba(255,255,255,.075);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08);
}

.lunashid-actions{
    display:flex;
    align-items:center;
    gap:8px;

    position:relative;
    z-index:2;
}

.glass-button{
    padding:10px 14px;

    border-radius:13px;

    background:
        rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.10);

    color:#fff;

    transition:.2s;
}

.glass-button:hover{
    background:
        rgba(255,255,255,.10);

    border-color:
        rgba(255,255,255,.20);
}

.site-container{
    width:min(
        1200px,
        calc(100% - 32px)
    );

    margin:0 auto;
}

.site-main{
    padding:25px 0 70px;
}

.site-footer{
    width:min(
        1200px,
        calc(100% - 32px)
    );

    margin:40px auto 20px;

    padding:25px;

    border-radius:25px;

    text-align:center;

    color:rgba(255,255,255,.45);
}

@media(max-width:850px){

    .lunashid-header{
        flex-wrap:wrap;
        justify-content:center;
    }

    .lunashid-nav{
        order:3;
        width:100%;
        justify-content:center;
        overflow:auto;
    }

    .lunashid-actions{
        display:none;
    }

}

</style>

{% block extra_head %}{% endblock %}

</head>

<body>

{% block header %}

<header class="lunashid-header">

    <a href="/" class="lunashid-brand">

        <div class="lunashid-logo">
            L
        </div>

        <div>
            <strong>
                {{ site_settings.site_name }}
            </strong>

            <span>
                HANDMADE CERAMICS
            </span>
        </div>

    </a>


    <nav class="lunashid-nav">

        <a href="/">
            خانه
        </a>

        <a href="/products">
            محصولات
        </a>

        <a href="/about">
            درباره ما
        </a>

        <a href="/cart">
            سبد خرید
        </a>

    </nav>


    <div class="lunashid-actions">

        <a href="/admin" class="glass-button">
            مدیریت
        </a>

    </div>

</header>

{% endblock %}


<main class="site-container site-main">

{% block content %}{% endblock %}

</main>


<footer class="site-footer site-glass">

    {{ site_settings.site_description }}

</footer>


{% block scripts %}{% endblock %}

</body>

</html>
